server.port=8080
spring.application.name=autotrade-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:used_car_db}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# Giữ dữ liệu tiếng Việt nhất quán khi chạy PostgreSQL trên Windows có code page Cp1252.
spring.datasource.hikari.connection-init-sql=SET client_encoding TO 'UTF8'


# Hibernate DDL Validation (Validate JPA Entities against PostgreSQL Schema)
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Truy cập giao diện tại: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Authentication secrets must be supplied by the runtime environment, never committed.
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.security.reset-session-minutes=${RESET_SESSION_MINUTES:10}

# SMTP credentials are read from Tomcat's environment (setenv.bat) or the process environment.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000
app.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
app.mail.from-name=${SMTP_FROM_NAME:AutoTrade}
